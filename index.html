<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>BirdQuiz.v3</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>
<!-- partial:index.partial.html -->
<!-- HTML -->
<div class="container">
    <!-- Home Screen -->
    <div class="screen" id="homeScreen">
        <h1>🦜 Bangalore Bird Quiz</h1>
        <button onclick="startQuiz()" class="play-btn">Start Quiz</button>
    </div>

    <!-- Quiz Screen -->
    <div class="screen" id="quizScreen" style="display: none;">
        <div class="header">
            <div class="streak">Streak: <span id="streakCounter">0</span></div>
           
        </div>
        
        <h2>Which bird is this?</h2>
        <audio id="birdAudio" controls></audio>
        <div class="choices" id="choices"></div>
        <button onclick="nextQuestion()" class="next-btn" id="nextBtn" disabled>Next Question →</button>
    </div>
</div>

<!-- Add this after homeScreen div -->
<div class="screen game-over-screen" id="gameOverScreen" style="display: none;">
    <h2>Game Over!</h2>
    <p>You got 3 answers wrong. Better luck next time!</p>
    <button onclick="restartGame()" class="play-btn">🔄 Play Again</button>
</div>
<!-- partial -->
  <script  src="./script.js"></script>

</body>
</html>
